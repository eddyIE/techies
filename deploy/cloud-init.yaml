#cloud-config
# Rebuilds the whole stack on a fresh Oracle Cloud ARM VM, unattended.
#
# Paste this into "Show advanced options -> Management -> Cloud-init script" when creating
# the instance. It installs Docker, fetches the code, generates secrets and brings the stack
# up, so replacing a lost instance is one instance-create rather than an afternoon.
#
# Set REPO_URL below before using it. If you want to keep the same JWT secret across
# rebuilds (so existing app tokens keep working), also set JWT_SECRET_OVERRIDE.

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git
  - iptables-persistent

write_files:
  - path: /opt/techies-bootstrap.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euxo pipefail

      REPO_URL="${REPO_URL:-https://github.com/YOUR_USER/YOUR_REPO.git}"
      APP_USER="ubuntu"
      APP_DIR="/home/${APP_USER}/techies"
      # Leave empty to generate a fresh secret. Set it to keep tokens valid across rebuilds.
      JWT_SECRET_OVERRIDE="${JWT_SECRET_OVERRIDE:-}"

      # --- Docker ---------------------------------------------------------------
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
      https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
        > /etc/apt/sources.list.d/docker.list
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      usermod -aG docker "${APP_USER}"

      # --- Firewall -------------------------------------------------------------
      # Oracle's Ubuntu images drop everything except SSH. The VCN security list rule is
      # separate and must still be added in the console.
      iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
      netfilter-persistent save

      # --- Application ----------------------------------------------------------
      sudo -u "${APP_USER}" git clone "${REPO_URL}" "${APP_DIR}"
      cd "${APP_DIR}"
      sudo -u "${APP_USER}" cp .env.example .env

      if [ -n "${JWT_SECRET_OVERRIDE}" ]; then
        JWT="${JWT_SECRET_OVERRIDE}"
      else
        JWT="$(openssl rand -base64 48 | tr -d '\n')"
      fi
      DBPW="$(openssl rand -base64 24 | tr -d '\n/+=')"

      sudo -u "${APP_USER}" sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${JWT}|" .env
      sudo -u "${APP_USER}" sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${DBPW}|" .env

      # Refuse to start with the shipped placeholders.
      if grep -q "change-me\|techies_local_dev" .env; then
        echo "FATAL: .env still contains default secrets" >&2
        exit 1
      fi

      sudo -u "${APP_USER}" docker compose \
        -f docker-compose.yml -f docker-compose.prod.yml up -d --build

      echo "bootstrap finished at $(date -Is)" > /opt/techies-bootstrap.done

  # Keeps the box above Oracle's idle-reclamation threshold and acts as a health probe.
  - path: /etc/cron.d/techies-keepalive
    permissions: "0644"
    content: |
      */5 * * * * ubuntu curl -fsS -o /dev/null http://localhost/api/categories || true

runcmd:
  - ["/bin/bash", "-c", "/opt/techies-bootstrap.sh 2>&1 | tee /var/log/techies-bootstrap.log"]

final_message: "Techies stack bootstrapped after $UPTIME seconds. Check /var/log/techies-bootstrap.log"
