server:
  port: 8081

spring:
  application:
    name: identity-service
  servlet:
    multipart:
      # Slightly above the 2 MB business limit so the service returns its own
      # FILE_TOO_LARGE error rather than Tomcat rejecting the request opaquely.
      max-file-size: 3MB
      max-request-size: 3MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:techies}
    username: ${POSTGRES_USER:techies}
    password: ${POSTGRES_PASSWORD:techies_local_dev}
    hikari:
      schema: identity
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      # Gmail on 587 opens in the clear and upgrades, so STARTTLS has to be required rather
      # than merely enabled: without it a downgrade would send the app password unencrypted.
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  flyway:
    enabled: true
    schemas: identity
    default-schema: identity
    create-schemas: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # spring-boot-starter-mail contributes a health indicator that opens an SMTP connection
    # every time /actuator/health is called. The Docker healthcheck calls it every 5 seconds,
    # so leaving it on means either a container that is never healthy (no credentials) or a
    # connection to Gmail every 5 seconds (with them). Mail is not on the critical path:
    # nothing else in the stack waits on it, and a failed send is logged and dropped.
    mail:
      enabled: false

techies:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-bytes}
    ttl-days: ${JWT_TTL_DAYS:30}
  verification:
    # Six digits is only a million combinations, so the short life and the attempt cap are
    # most of the strength here. 10 minutes is long enough to find the mail in a spam folder.
    ttl: 10m
    resend-cooldown: 60s
    max-attempts: 5
    from-name: ${MAIL_FROM_NAME:Techies}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: Techies Identity API
    description: Accounts, authentication and delivery addresses
    version: 1.0.0
