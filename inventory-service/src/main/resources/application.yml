server:
  port: 8083

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:techies}
    username: ${POSTGRES_USER:techies}
    password: ${POSTGRES_PASSWORD:techies_local_dev}
    hikari:
      schema: inventory
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: inventory
    open-in-view: false
  flyway:
    enabled: true
    schemas: inventory
    default-schema: inventory
    create-schemas: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: Techies Inventory API
    description: Stock levels, atomic deduct and compensating restore
    version: 1.0.0
