server:
  port: 8082

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:techies}
    username: ${POSTGRES_USER:techies}
    password: ${POSTGRES_PASSWORD:techies_local_dev}
    hikari:
      schema: catalog
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    enabled: true
    schemas: catalog
    default-schema: catalog
    create-schemas: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: Techies Catalog API
    description: Categories, product listing, search and detail
    version: 1.0.0
