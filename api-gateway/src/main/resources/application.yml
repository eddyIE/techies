server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            # ---- public ----
            - id: auth
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            - id: categories
              uri: lb://catalog-service
              predicates:
                - Path=/api/categories/**
              filters:
                - StripPrefix=1

            # Before the catalog route: reviews live with the purchases that entitle them,
            # in order-service, so this one more specific path has to win. Gateway predicates
            # are evaluated in declaration order.
            - id: product-reviews
              uri: lb://order-service
              predicates:
                - Path=/api/products/*/reviews
              filters:
                - StripPrefix=1

            # Its own route purely for the timeout. The first read after a new review waits on
            # a Gemini round trip, which the global 10s ceiling would cut every time; the
            # review list beside it stays on the fast default.
            - id: product-review-summary
              uri: lb://order-service
              predicates:
                - Path=/api/products/*/review-summary
              filters:
                - StripPrefix=1
              metadata:
                response-timeout: 35000
                connect-timeout: 3000
            - id: products
              uri: lb://catalog-service
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=1

            # Read-only stock badge. Only GET, and only a single product id: /api/stock/deduct
            # and /api/stock/restore deliberately match nothing and 404 at the edge.
            - id: stock-read
              uri: lb://inventory-service
              predicates:
                - Path=/api/stock/{productId}
                - Method=GET
              filters:
                - StripPrefix=1

            # ---- authenticated ----
            - id: users
              uri: lb://identity-service
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1

            - id: addresses
              uri: lb://identity-service
              predicates:
                - Path=/api/addresses/**
              filters:
                - StripPrefix=1

            - id: cart
              uri: lb://order-service
              predicates:
                - Path=/api/cart/**
              filters:
                - StripPrefix=1

            - id: checkout
              uri: lb://order-service
              predicates:
                - Path=/api/checkout
              filters:
                - StripPrefix=1

            - id: orders
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1

            # Only the five customer-facing paths. /loyalty/points and the voucher
            # consume and release endpoints are deliberately absent, so they 404 at the edge:
            # a customer must never award themselves points, and releasing their own voucher
            # mid-checkout would hand them the discount twice.
            - id: loyalty-read
              uri: lb://loyalty-service
              predicates:
                - Path=/api/loyalty/me,/api/loyalty/gifts,/api/loyalty/claimed-gifts,/api/loyalty/vouchers
                - Method=GET
              filters:
                - StripPrefix=1

            - id: loyalty-claim
              uri: lb://loyalty-service
              predicates:
                - Path=/api/loyalty/gifts/{giftId}/claim
                - Method=POST
              filters:
                - StripPrefix=1

            # Server-sent events. The global 10s response timeout would cut a streamed
            # reply mid-sentence, so this route gets its own, matched to the AI service's
            # own ceiling.
            #
            # /ai/chat by name, not /api/ai/**: /ai/review-summary is internal, and routing it
            # would let a customer spend the day's Gemini quota by reloading a product page.
            - id: ai
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/chat
                - Method=POST
              filters:
                - StripPrefix=1
              metadata:
                response-timeout: 90000
                connect-timeout: 3000

          httpclient:
            connect-timeout: 2000
            response-timeout: 10s

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

techies:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-bytes}
  public-paths:
    # Profile images are loaded directly by an image library on the device, which cannot
    # easily attach a bearer token. GET only: uploading and deleting stay authenticated.
    - "GET:/api/users/*/avatar"
    - /api/auth/**
    - /api/categories/**
    - /api/products/**
    - /api/stock/**
    - /actuator/**
